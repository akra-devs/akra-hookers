[package]
name = "akra-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
akra-core = { path = "../akra-core" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml_edit = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
named-lock = "0.4.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

name: Desktop CI and release

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - ".github/workflows/desktop-release.yml"
      - "desktop/**"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install Rust 1.96
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          npm ci --prefix desktop --ignore-scripts
      - name: Validate source
        shell: pwsh
        run: |
          cargo test --workspace --locked
          npm test --prefix web
          npm test --prefix desktop
          npm audit --prefix desktop --audit-level=high
      - name: Build portable application
        shell: pwsh
        env:
          AKRA_DESKTOP_VERSION: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '0.1.0' }}
        run: |
          if ($env:AKRA_DESKTOP_VERSION.StartsWith('desktop-v')) {
            $env:AKRA_DESKTOP_VERSION = $env:AKRA_DESKTOP_VERSION.Substring(9)
          }
          npm run build --prefix desktop
          $package = 'desktop/dist/Akra Hookers-win32-x64'
          $archive = 'desktop/dist/Akra-Hookers-Windows-x64-portable.zip'
          Compress-Archive -LiteralPath $package -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  Akra-Hookers-Windows-x64-portable.zip" | Set-Content -Encoding ascii 'desktop/dist/Akra-Hookers-Windows-x64-portable.zip.sha256'
      - name: Upload validated portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Akra-Hookers-Windows-x64-portable
          path: |
            desktop/dist/Akra-Hookers-Windows-x64-portable.zip
            desktop/dist/Akra-Hookers-Windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Akra-Hookers-Windows-x64-portable
          path: release
      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'release/Akra-Hookers-Windows-x64-portable.zip' `
            'release/Akra-Hookers-Windows-x64-portable.zip.sha256' `
            --verify-tag --generate-notes --title "Akra Hookers $env:GITHUB_REF_NAME"
